<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fieldia — script tag</title>
    <link rel="stylesheet" href="../demo.css" />
    <link rel="stylesheet" href="../shell.css" />
  </head>
  <body>
    <header id="demo-head" data-app="script"></header>
    <main id="app"></main>
    <!-- The frame as soon as it comes (async): not after fieldia.js below, which blocks the page as it loads, has drawn
         the form, which the frame would then push down. -->
    <script type="module" async src="../shell.mjs"></script>
    <!-- The whole of Fieldia's viewer in one file: core, widgets and viewer, as the global `Fieldia`. Its own words are English. -->
    <script src="fieldia.js"></script>
    <script>
      const page = {
        fieldia: '0.13',
        id: 'call-back',
        title: 'Ask for a call back',
        data: { kind: 'responses' },
        fields: {
          name: { type: 'char', label: 'Your name', required: true },
          phone: { type: 'char', label: 'Phone', required: true },
          when: {
            type: 'selection',
            label: 'Best time',
            options: [
              { value: 'morning', label: 'Morning' },
              { value: 'afternoon', label: 'Afternoon' },
            ],
          },
        },
        layout: {
          type: 'sections',
          id: 'sections',
          children: [
            {
              type: 'section',
              id: 'you',
              columns: 2,
              children: [
                { type: 'field', id: 'name', field: 'name' },
                { type: 'field', id: 'phone', field: 'phone' },
                { type: 'field', id: 'when', field: 'when', widget: 'radio' },
              ],
            },
          ],
        },
        // The page's own words in other languages; Fieldia's own words come with its language script.
        translations: {
          ar: { 'Ask for a call back': 'اطلب أن نتصل بك', 'Your name': 'اسمك', Phone: 'الهاتف', 'Best time': 'أفضل وقت', Morning: 'صباحًا', Afternoon: 'بعد الظهر' },
          de: { 'Ask for a call back': 'Rückruf anfordern', 'Your name': 'Ihr Name', Phone: 'Telefon', 'Best time': 'Beste Zeit', Morning: 'Vormittags', Afternoon: 'Nachmittags' },
          fr: { 'Ask for a call back': 'Demander à être rappelé', 'Your name': 'Votre nom', Phone: 'Téléphone', 'Best time': 'Meilleur moment', Morning: 'Le matin', Afternoon: 'L’après-midi' },
          // Turkish, Persian, Urdu and Spanish: machine-assisted, not yet reviewed by a native speaker, as Fieldia's own words in them are.
          tr: { 'Ask for a call back': 'Sizi aramamızı isteyin', 'Your name': 'Adınız', Phone: 'Telefon', 'Best time': 'En uygun zaman', Morning: 'Sabah', Afternoon: 'Öğleden sonra' },
          fa: { 'Ask for a call back': 'درخواست تماس', 'Your name': 'نام شما', Phone: 'تلفن', 'Best time': 'بهترین زمان', Morning: 'صبح', Afternoon: 'بعدازظهر' },
          ur: { 'Ask for a call back': 'کال بیک کی درخواست کریں', 'Your name': 'آپ کا نام', Phone: 'فون', 'Best time': 'بہترین وقت', Morning: 'صبح', Afternoon: 'سہ پہر' },
          es: { 'Ask for a call back': 'Solicite que le llamemos', 'Your name': 'Su nombre', Phone: 'Teléfono', 'Best time': 'Mejor momento', Morning: 'Por la mañana', Afternoon: 'Por la tarde' },
        },
      };
      const locale = new URLSearchParams(location.search).get('locale') || 'en';
      function show() {
        const dataSource = Fieldia.createMemoryDataSource();
        const handle = Fieldia.mountViewer(document.getElementById('app'), { page, dataSource, skin: 'outlined', locale });
        window.fieldiaDemo = { handle, dataSource, page, version: Fieldia.VERSION };
      }
      // Arabic, German and French each come in a script of their own, loaded after fieldia.js: fieldia.ar.js,
      // fieldia.de.js, fieldia.fr.js — and Turkish, Persian, Urdu and Spanish (machine-assisted, not yet reviewed by a
      // native speaker): fieldia.tr.js, fieldia.fa.js, fieldia.ur.js, fieldia.es.js. Here the address picks the language
      // (/script/?locale=ar), so its script is added as the page starts; a page in one language just writes its script
      // tag after fieldia.js.
      if (['ar', 'de', 'fr', 'tr', 'fa', 'ur', 'es'].includes(locale)) {
        const words = document.createElement('script');
        words.src = `fieldia.${locale}.js`;
        words.onload = show;
        document.head.append(words);
      } else {
        show();
      }
    </script>
  </body>
</html>
