<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment schedule — a sample to copy</title>
<style>
  body { font: 15px/1.5 Georgia, serif; margin: 32px; color: #1d2024; background: #fdfcf8; }
  table { border-collapse: collapse; width: 560px; font-family: Arial, sans-serif; }
  th { background: #0b5cad; color: #fff; text-align: left; padding: 6px 10px; }
  td { border-bottom: 1px solid #c9ced4; padding: 6px 10px; }
  td.amount, th.amount { text-align: right; }
  tr:nth-child(even) td { background: #eef3f9; }
</style>
</head>
<body>
<p>Select the table below, copy it (Ctrl+C, or ⌘C on a Mac) and paste it into a formatted text in the demo: it comes in as a plain table, without these colours, fonts and widths.</p>
<table>
  <thead>
    <tr><th>Milestone</th><th>Due</th><th class="amount">Share</th><th class="amount">Amount</th></tr>
  </thead>
  <tbody>
    <tr><td>Signing</td><td>On signing</td><td class="amount">30%</td><td class="amount" style="font-weight: bold">5,220.00</td></tr>
    <tr><td>Design approved</td><td>Week 4</td><td class="amount">30%</td><td class="amount">5,220.00</td></tr>
    <tr><td>Shop live</td><td>Week 10</td><td class="amount">40%</td><td class="amount">6,960.00</td></tr>
  </tbody>
</table>
</body>
</html>
