name: Site

# fieldia.dev on GitHub Pages. It deploys only a commit whose CI run on main
# passed — the same browser gates cover every page, link and the live form —
# or when started by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every package a demo consumes as built: the Angular binding, and the designer's Angular editors.
      - run: npx nx run-many -t build -p angular viewer designer
        env:
          NX_DAEMON: 'false'
      - run: node tools/build-demos.mjs
      - run: node tools/build-site.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
