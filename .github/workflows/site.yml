name: Site

# fieldia.dev on GitHub Pages. It deploys only a commit whose CI run on main
# passed — the same browser gates cover every page, link and the live form —
# or when started by hand. A commit its pull request already tested passes CI on
# main at once (tools/ci-scope.mjs), so it deploys within minutes of the merge.
#
# Only a CI run of a push to this repository's main deploys: `branches: [main]`
# matches the name of the branch a run was for, so a fork's pull request from a
# branch it named main would pass it. The build runs with read access alone;
# Pages and the OIDC token are the deploy job's, which runs no code of the
# commit's.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Every package a demo consumes as built: the Angular binding, and the designer's Angular editors.
      - run: npx nx run-many -t build -p angular viewer designer
        env:
          NX_DAEMON: 'false'
      - run: node tools/build-demos.mjs
      - run: node tools/build-site.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
