name: CI

on:
  push:
    branches: [main]
  pull_request:

# This file is the gate list. A check that does not run here does not exist,
# however often it passes on someone's machine.
jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: the release notes' test finds every release commit in it.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The release tools: CHANGELOG.md has a section for every version released, and the page format's shapes.
      - run: node --test tools/release-notes.test.mjs tools/format-shape.test.mjs
      # `build` ends in tools/dual-build.mjs, which fails when a package's
      # exports point at missing files or its ESM output would not resolve in
      # Node — the packaging mistakes that pass every source-level test.
      - run: npx nx run-many -t typecheck lint test build
        env:
          NX_DAEMON: 'false'
      # Pack every package and install the packs into an empty project:
      # require, import, types and the script bundle, as a user would meet them.
      - run: node tools/release.mjs check
      # @fieldia/map's own code with the page, and Leaflet in a chunk of its own, each under its budget.
      - run: node tools/map-bundle.mjs
      # @fieldia/calendar: its name on the list's switcher with the page, the calendar in a chunk of its own, each under its budget.
      - run: node tools/calendar-bundle.mjs

  browser:
    name: Browser gates (every framework demo, ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    # The first quarter took 19 minutes on 0.22's first green run: room above it, so a slow runner is not a failure.
    timeout-minutes: 30
    # Four runners, each the whole build and a quarter of the scenarios: one alone
    # had grown to 19 of its 20 minutes, and so had half of them by Phase 26; a
    # third of them passed 20 minutes once 0.22 brought some 400 more.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser kept between runs, by Playwright's version: most runs download nothing.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Chromium and the system packages it needs. An apt mirror can stall for good (three times on
      # 7 Oct): apt gives up on a silent mirror after 30 s and retries; each try has 4 minutes; and a
      # try cut off mid-apt leaves its lock and half-set packages, so the next one clears them first.
      - name: Install Chromium for Playwright
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99fieldia-timeouts > /dev/null
          for try in 1 2 3; do
            if [ "$try" -gt 1 ]; then
              sudo pkill -9 -x apt-get || true
              sudo pkill -9 -x dpkg || true
              sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
              sudo dpkg --configure -a || true
            fi
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "Install try $try stalled or failed."
          done
          exit 1
      # Each demo mounts the same pages through a different framework; every
      # scenario runs against each one, and variants.spec.ts fails if a demo
      # was not built, so a missing framework cannot skip its gates quietly.
      # The Angular demos consume the BUILT @fieldia/angular and the built
      # @fieldia/designer/angular (ngc, partial), so the gates exercise the
      # packages as they would be published.
      - run: npx nx run-many -t build -p angular viewer designer
        env:
          NX_DAEMON: 'false'
      - run: node tools/build-demos.mjs
      # fieldia.dev, gated like the demos: every page, link and the live form.
      - run: node tools/build-site.mjs
      - run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  engines:
    name: Browser smoke in ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Firefox, and WebKit — Safari's engine, which every browser on an iPhone runs: the smoke set playwright.config.ts
    # names (forms, behaviour, layout, lists, dialogs, the quiet look, a place on a map, right to left, a part that
    # fails), in the plain demo. Chromium runs everything, in the job above.
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.engine }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The engine and the system packages it needs, with the same guard against a stalled apt mirror as Chromium's.
      - name: Install ${{ matrix.engine }} for Playwright
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99fieldia-timeouts > /dev/null
          for try in 1 2 3; do
            if [ "$try" -gt 1 ]; then
              sudo pkill -9 -x apt-get || true
              sudo pkill -9 -x dpkg || true
              sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
              sudo dpkg --configure -a || true
            fi
            timeout 300 npx playwright install --with-deps ${{ matrix.engine }} && exit 0
            echo "Install try $try stalled or failed."
          done
          exit 1
      - run: npx nx run-many -t build -p angular viewer designer
        env:
          NX_DAEMON: 'false'
      - run: node tools/build-demos.mjs
      - run: node tools/build-site.mjs
      - run: npx playwright test --project=${{ matrix.engine }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.engine }}
          path: test-results/
          retention-days: 14
