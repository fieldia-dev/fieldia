name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read access alone, unless a job says more (the scope job reads the runs of earlier pushes). Each action is named by
# the commit it runs, its tag in a comment beside it — a tag can be moved to other code, a commit cannot — and no
# checkout leaves its token in .git for the steps after it, `npm ci`'s install scripts among them; Dependabot moves the
# pins (.github/dependabot.yml), and tools/workflows.test.mjs holds every workflow to these rules.
permissions:
  contents: read

# This file is the gate list. A check that does not run here does not exist,
# however often it passes on someone's machine.
#
# Its first job reads what a change can reach (tools/ci-scope.mjs): a change to fieldia.dev alone runs the site's
# gates; a push to main of a commit whose pull request passed CI runs none again, main being fast-forwarded to the
# commit the pull request tested; anything else runs every gate.
jobs:
  scope:
    name: What this change can break
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.scope.outputs.tested }}
      site: ${{ steps.scope.outputs.site }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        run: node tools/ci-scope.mjs
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}

  check:
    name: Typecheck, lint, test, build
    needs: scope
    if: needs.scope.outputs.tested != 'true' && needs.scope.outputs.site != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The whole history: the release notes' test finds every release commit in it.
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The release tools: CHANGELOG.md has a section for every version released, and the page format's shapes; and the
      # words the script bundle's parts carry for themselves, read by their parts alone (tools/part-words.mjs).
      # And a strict Content-Security-Policy in the packages' source: no code made from text, no style attribute
      # written, every <style> made with the page's nonce (tools/csp-source.test.mjs).
      # And the release's own guard rails: its checks run with no npm token, the workflows keep their rules.
      - run: node --test tools/release-notes.test.mjs tools/format-shape.test.mjs tools/part-words.test.mjs tools/ci-scope.test.mjs tools/csp-source.test.mjs tools/release-env.test.mjs tools/workflows.test.mjs
      # The tools themselves, linted as the packages are (`nx lint` reads the packages alone): four errors hid there in 0.31.
      - run: npx eslint tools eslint.config.mjs
      # `build` ends in tools/dual-build.mjs, which fails when a package's
      # exports point at missing files or its ESM output would not resolve in
      # Node — the packaging mistakes that pass every source-level test.
      - run: npx nx run-many -t typecheck lint test build
        env:
          NX_DAEMON: 'false'
      # Pack every package and install the packs into an empty project:
      # require, import, types and the script bundle, as a user would meet them.
      - run: node tools/release.mjs check
      # @fieldia/map's own code with the page, and Leaflet in a chunk of its own, each under its budget.
      - run: node tools/map-bundle.mjs
      # @fieldia/calendar: its name on the list's switcher with the page, the calendar in a chunk of its own, each under its budget.
      - run: node tools/calendar-bundle.mjs
      # @fieldia/gantt: its name on the list's switcher with the page, the timeline in a chunk of its own, each under its budget.
      - run: node tools/gantt-bundle.mjs

  browser:
    name: Browser gates (every framework demo, ${{ matrix.shard }} of 4)
    needs: scope
    if: needs.scope.outputs.tested != 'true' && needs.scope.outputs.site != 'true'
    runs-on: ubuntu-latest
    # The first quarter took 19 minutes on 0.22's first green run: room above it, so a slow runner is not a failure;
    # 23 Oct the runners' Ubuntu mirror crawled (a 13 MB package in minutes) and ate 10 of the 30: room for that too.
    timeout-minutes: 45
    # Four runners, each the whole build and a quarter of the scenarios: one alone
    # had grown to 19 of its 20 minutes, and so had half of them by Phase 26; a
    # third of them passed 20 minutes once 0.22 brought some 400 more.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The browser kept between runs, by Playwright's version: most runs download nothing.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Chromium and the system packages it needs. An apt mirror can stall for good (three times on
      # 7 Oct): apt gives up on a silent mirror after 30 s and retries; each try has 7 minutes (a slow one crawls); and a
      # try cut off mid-apt leaves its lock and half-set packages, so the next one clears them first.
      - name: Install Chromium for Playwright
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99fieldia-timeouts > /dev/null
          for try in 1 2 3; do
            if [ "$try" -gt 1 ]; then
              sudo pkill -9 -x apt-get || true
              sudo pkill -9 -x dpkg || true
              sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
              sudo dpkg --configure -a || true
            fi
            timeout 420 npx playwright install --with-deps chromium && exit 0
            echo "Install try $try stalled or failed."
          done
          exit 1
      # Each demo mounts the same pages through a different framework; every
      # scenario runs against each one, and variants.spec.ts fails if a demo
      # was not built, so a missing framework cannot skip its gates quietly.
      # The Angular demos consume the BUILT @fieldia/angular and the built
      # @fieldia/designer/angular (ngc, partial), so the gates exercise the
      # packages as they would be published.
      - run: npx nx run-many -t build -p angular viewer designer
        env:
          NX_DAEMON: 'false'
      - run: node tools/build-demos.mjs
      # fieldia.dev, gated like the demos: every page, link and the live form.
      - run: node tools/build-site.mjs
      - run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screens-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  engines:
    name: Browser smoke in ${{ matrix.engine }} (${{ matrix.shard }} of 2)
    needs: scope
    if: needs.scope.outputs.tested != 'true' && needs.scope.outputs.site != 'true'
    runs-on: ubuntu-latest
    # Each engine's smoke set in two halves: one runner took 12–19 minutes of its 25 for the whole set in 0.30.1 (WebKit
    # hit the limit once), and 0.31 adds some thirty specs to it; a half and the build it needs fit well inside 25 —
    # but not with a crawling Ubuntu mirror (23 Oct: three 5-minute install tries ran out mid-download): 40.
    timeout-minutes: 40
    # Firefox, and WebKit — Safari's engine, which every browser on an iPhone runs: the smoke set playwright.config.ts
    # names (forms, behaviour, layout, lists, dialogs, the quiet look, a place on a map, right to left, a part that
    # fails), in the plain demo. Chromium runs everything, in the job above.
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.engine }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The engine and the system packages it needs, with the same guard against a stalled apt mirror as Chromium's.
      - name: Install ${{ matrix.engine }} for Playwright
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99fieldia-timeouts > /dev/null
          for try in 1 2 3; do
            if [ "$try" -gt 1 ]; then
              sudo pkill -9 -x apt-get || true
              sudo pkill -9 -x dpkg || true
              sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
              sudo dpkg --configure -a || true
            fi
            timeout 600 npx playwright install --with-deps ${{ matrix.engine }} && exit 0
            echo "Install try $try stalled or failed."
          done
          exit 1
      - run: npx nx run-many -t build -p angular viewer designer
        env:
          NX_DAEMON: 'false'
      - run: node tools/build-demos.mjs
      - run: node tools/build-site.mjs
      - run: npx playwright test --project=${{ matrix.engine }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screens-${{ matrix.engine }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  site:
    name: fieldia.dev alone
    needs: scope
    if: needs.scope.outputs.tested != 'true' && needs.scope.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A change to the site's own files: the site built from the demos and packages as they are, and its own specs —
    # every page, link and the live forms (site.spec.ts) and axe on every page, light and dark (a11y.spec.ts).
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for Playwright
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' | sudo tee /etc/apt/apt.conf.d/99fieldia-timeouts > /dev/null
          for try in 1 2 3; do
            if [ "$try" -gt 1 ]; then
              sudo pkill -9 -x apt-get || true
              sudo pkill -9 -x dpkg || true
              sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
              sudo dpkg --configure -a || true
            fi
            timeout 420 npx playwright install --with-deps chromium && exit 0
            echo "Install try $try stalled or failed."
          done
          exit 1
      - run: npx nx run-many -t build -p angular viewer designer
        env:
          NX_DAEMON: 'false'
      - run: node tools/build-demos.mjs
      - run: node tools/build-site.mjs
      - run: npx playwright test e2e/site.spec.ts --project=chromium
      - run: npx playwright test e2e/a11y.spec.ts --project=chromium -g "axe on fieldia.dev"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screens-site
          path: test-results/
          retention-days: 14
