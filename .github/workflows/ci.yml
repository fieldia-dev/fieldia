name: CI

on:
  push:
    branches: [main]
  pull_request:

# This file is the gate list. A check that does not run here does not exist,
# however often it passes on someone's machine.
jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # `build` ends in tools/dual-build.mjs, which fails when a package's
      # exports point at missing files or its ESM output would not resolve in
      # Node — the packaging mistakes that pass every source-level test.
      - run: npx nx run-many -t typecheck lint test build
        env:
          NX_DAEMON: 'false'
      # Pack every package and install the packs into an empty project:
      # require, import, types and the script bundle, as a user would meet them.
      - run: node tools/release.mjs check

  browser:
    name: Browser gates (every framework demo, ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Two runners, each the whole build and half the scenarios: one alone had
    # grown to 19 of its 20 minutes.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Each demo mounts the same pages through a different framework; every
      # scenario runs against each one, and variants.spec.ts fails if a demo
      # was not built, so a missing framework cannot skip its gates quietly.
      # The Angular demos consume the BUILT @fieldia/angular and the built
      # @fieldia/designer/angular (ngc, partial), so the gates exercise the
      # packages as they would be published.
      - run: npx nx run-many -t build -p angular viewer designer
        env:
          NX_DAEMON: 'false'
      - run: node tools/build-demos.mjs
      # fieldia.dev, gated like the demos: every page, link and the live form.
      - run: node tools/build-site.mjs
      - run: npx playwright test --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
